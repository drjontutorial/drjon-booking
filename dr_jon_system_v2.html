<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr Jon Booking System</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
<style>
:root{--brand:#a94f8d;--bg:#f6f4f8;--green:#3a9e6a;--line:#e8e4ed}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:sans-serif;color:#1a1025;padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{color:var(--brand);margin-bottom:20px}
.toggle{position:fixed;top:20px;right:20px;background:#fff;padding:10px 16px;border:2px solid var(--brand);border-radius:8px;cursor:pointer;font-weight:700;z-index:100}
.mode{display:none}
.mode.active{display:block}
.week{margin:30px 0}
.slot{display:inline-block;padding:12px 16px;margin:6px;background:var(--green);color:#fff;border-radius:8px;cursor:pointer;font-weight:700}
.slot.booked{background:#999;cursor:not-allowed}
.slot.pending{background:#ff9800}
.slot.selected{background:#673ab7;box-shadow:0 0 10px rgba(0,0,0,.3)}
input{border:1px solid var(--line);padding:12px;border-radius:8px;width:100%;margin:10px 0;font-size:16px}
button{background:var(--brand);color:#fff;border:0;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:700;font-size:16px;width:100%;margin-top:12px}
button:hover{opacity:.9}
.booking{background:#fff;padding:16px;margin:12px 0;border-radius:8px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.booking.pending{background:#fff8e6}
.booking.approved{background:#e8f5e9}
.status{padding:6px 12px;border-radius:6px;font-weight:700;font-size:12px;display:inline-block}
.status.pending{background:#ff9800;color:#fff}
.status.approved{background:var(--green);color:#fff}
.msg{padding:12px;border-radius:8px;margin-top:16px;background:#4caf50;color:#fff;text-align:center}
.msg.error{background:#f44336}
.codes-list{background:#fff;padding:20px;border-radius:8px;margin:20px 0;max-height:400px;overflow-y:auto;font-family:monospace}
.codes-list div{padding:4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>

<div class="toggle" onclick="toggleMode()">🔄 Admin</div>

<!-- STUDENT -->
<div id="student" class="mode active">
<div class="container">
<h1>Dr Jon Summer Booking</h1>
<div id="slots"></div>
<input type="text" id="code" maxlength="4" placeholder="4-digit code (e.g., Aa01)">
<button onclick="book()">Book</button>
<div id="msg"></div>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="mode">
<div class="container">
<h1>Admin Panel</h1>
<input type="password" id="pwd" placeholder="Password">
<button onclick="login()">Login</button>
<div id="panel" style="display:none">
<h2>All Valid Codes</h2>
<div class="codes-list" id="codesList"></div>
<h2>Bookings</h2>
<div id="list"></div>
</div>
</div>
</div>

<script>
const config={apiKey:"AIzaSyAS34ly4yLmiw8hBWN62wg5fi8IhzPwZqI",databaseURL:"https://drjonbooking-default-rtdb.firebaseio.com",projectId:"drjonbooking"};
firebase.initializeApp(config);
const db=firebase.database();
const ADMIN_PWD="drjon2026";
let selected=[];
let loggedIn=false;

// Generate all 676 codes (Aa01-Az26, Ba01-Bz26, ..., Za01-Zz26)
let VALID_CODES=[];
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
letters.forEach(first=>{
  letters.forEach(second=>{
    for(let i=1;i<=26;i++){
      VALID_CODES.push(first+second.toLowerCase()+String(i).padStart(2,'0'));
    }
  });
});

const weeks=[
{w:"w1",r:"29/6-5/7",d:[["29/6","Mon","2026-06-29"],["30/6","Tue","2026-06-30"],["1/7","Wed","2026-07-01"],["2/7","Thu","2026-07-02"],["3/7","Fri","2026-07-03"],["4/7","Sat","2026-07-04"],["5/7","Sun","2026-07-05"]]},
{w:"w2",r:"6/7-12/7",d:[["6/7","Mon","2026-07-06"],["7/7","Tue","2026-07-07"],["8/7","Wed","2026-07-08"],["9/7","Thu","2026-07-09"],["10/7","Fri","2026-07-10"],["11/7","Sat","2026-07-11"],["12/7","Sun","2026-07-12"]]},
{w:"w3",r:"13/7-19/7",d:[["13/7","Mon","2026-07-13"],["14/7","Tue","2026-07-14"],["15/7","Wed","2026-07-15"],["16/7","Thu","2026-07-16"],["17/7","Fri","2026-07-17"],["18/7","Sat","2026-07-18"],["19/7","Sun","2026-07-19"]]},
{w:"w4",r:"20/7-26/7",d:[["20/7","Mon","2026-07-20"],["21/7","Tue","2026-07-21"],["22/7","Wed","2026-07-22"],["23/7","Thu","2026-07-23"],["24/7","Fri","2026-07-24"],["25/7","Sat","2026-07-25"],["26/7","Sun","2026-07-26"]]}
];
const times=[["10:00","10am"],["11:00","11am"],["12:00","12 noon"],["14:00","2pm"],["15:00","3pm"],["16:00","4pm"],["17:00","5pm"],["18:00","6pm"],["19:00","7pm"],["20:30","8:30pm"],["21:30","9:30pm"]];

function initSlots(){
let html='';
weeks.forEach(w=>{
html+=`<div class="week"><h2>${w.r}</h2>`;
times.forEach(t=>{
html+='<div>';
w.d.forEach(day=>{
const id=`${w.w}_${day[2].replace(/-/g,'')}${t[0].replace(':','')}`;
html+=`<span class="slot" id="${id}" onclick="toggle('${id}','${day[2]}','${t[1]}')">${day[0]}<br>${t[1]}</span>`;
});
html+='</div>';
});
html+='</div>';
});
document.getElementById('slots').innerHTML=html;
loadStatus();
}

function toggle(id,date,time){
const el=document.getElementById(id);
if(el.classList.contains('booked'))return;
el.classList.toggle('selected');
selected=selected.filter(x=>x.id!==id);
if(el.classList.contains('selected'))selected.push({id,date,time});
}

function loadStatus(){
db.ref('bookings').on('value',snap=>{
if(!snap.val())return;
Object.values(snap.val()).forEach(b=>{
const el=document.getElementById(b.slotId);
if(el){
el.classList.remove('selected');
if(b.status==='approved'){el.classList.add('booked');el.innerHTML='Booked';}
else if(b.status==='pending'){el.classList.add('pending');el.innerHTML='Pending';}
}
});
});
}

function book(){
const code=document.getElementById('code').value.toUpperCase();
if(!VALID_CODES.includes(code)){
document.getElementById('msg').innerHTML='<div class="msg error">❌ Invalid code</div>';
return;
}
if(selected.length===0){
document.getElementById('msg').innerHTML='<div class="msg error">❌ Select slots first</div>';
return;
}
selected.forEach(s=>{
db.ref('bookings').push({slotId:s.id,date:s.date,time:s.time,code,status:'pending',ts:Date.now()});
});
document.getElementById('msg').innerHTML='<div class="msg">✅ Submitted!</div>';
selected=[];
document.getElementById('code').value='';
}

function toggleMode(){
document.getElementById('student').classList.toggle('active');
document.getElementById('admin').classList.toggle('active');
}

function login(){
if(document.getElementById('pwd').value===ADMIN_PWD){
loggedIn=true;
document.getElementById('panel').style.display='block';
loadCodes();
loadBookings();
}else{alert('Wrong password');}
}

function loadCodes(){
let html='';
for(let i=0;i<VALID_CODES.length;i+=10){
let row='';
for(let j=0;j<10&&i+j<VALID_CODES.length;j++){
row+=VALID_CODES[i+j]+' | ';
}
html+=`<div>${row}</div>`;
}
document.getElementById('codesList').innerHTML=html;
}

function loadBookings(){
db.ref('bookings').on('value',snap=>{
if(!snap.val()){document.getElementById('list').innerHTML='<p>No bookings</p>';return;}
let html='';
Object.entries(snap.val()).forEach(([key,b])=>{
html+=`<div class="booking ${b.status}">
<div><strong>${b.date} ${b.time}</strong><br>Code: <strong>${b.code}</strong><br><span class="status ${b.status}">${b.status}</span></div>
<div>
<button onclick="approve('${key}')" style="background:var(--green);margin:0;width:auto;padding:8px 12px">✓ Approve</button>
<button onclick="reject('${key}')" style="background:#f44336;margin:0;width:auto;padding:8px 12px">✕ Reject</button>
</div></div>`;
});
document.getElementById('list').innerHTML=html;
});
}

function approve(key){db.ref('bookings/'+key).update({status:'approved'});}
function reject(key){db.ref('bookings/'+key).update({status:'rejected'});}

initSlots();
</script>
</body>
</html>
